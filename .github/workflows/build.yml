name: Iyuno converter

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl python-docx pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: mac-apple-silicon }
          - { os: macos-15-intel, name: mac-intel }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: runner.os == 'macOS'
        run: ./build.sh && cd dist && ditto -c -k --keepParent "Iyuno Converter.app" "Iyuno-Converter-${{ matrix.name }}.zip"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: iyuno-converter-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
