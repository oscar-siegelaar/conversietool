[project]
name = "iyuno-converter"
version = "0.1.2"
description = "Convert a SyncScript Excel export into an Iyuno (SDI) Word script"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.4"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
iyuno-converter = "iyuno_converter.__main__:main"

[tool.setuptools]
packages = ["iyuno_converter"]

[tool.setuptools.package-data]
iyuno_converter = ["template.docx"]

[tool.pytest.ini_options]
pythonpath = ["."]
